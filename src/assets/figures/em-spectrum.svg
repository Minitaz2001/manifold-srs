<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" class="manifold-figure-svg">
  <rect width="600" height="320" fill="var(--fig-bg, #131720)" rx="12" />
  <text x="20" y="28" fill="var(--fig-muted, #8b95a5)" font-size="13" font-family="system-ui, sans-serif" font-weight="600">ELECTROMAGNETIC SPECTRUM (LONG λ LEFT → HIGH ENERGY RIGHT)</text>
  <text x="22" y="288" fill="var(--fig-muted, #8b95a5)" font-size="11" font-family="ui-monospace, monospace">10³ m (kHz)</text>
  <text x="255" y="288" fill="var(--fig-muted, #8b95a5)" font-size="11" font-family="ui-monospace, monospace">Visible</text>
  <text x="486" y="288" fill="var(--fig-muted, #8b95a5)" font-size="11" font-family="ui-monospace, monospace">10⁻¹² m (MeV)</text>
  <g id="regions-layer">
    <rect id="em-radio" data-region="em-radio" data-label="Radio Waves" x="20" y="64" width="76" height="190" rx="6" class="figure-region" />
    <rect id="em-microwave" data-region="em-microwave" data-label="Microwaves" x="104" y="64" width="76" height="190" rx="6" class="figure-region" />
    <rect id="em-infrared" data-region="em-infrared" data-label="Infrared" x="188" y="64" width="78" height="190" rx="6" class="figure-region" />
    <rect id="em-visible" data-region="em-visible" data-label="Visible Light" x="274" y="64" width="44" height="190" rx="6" class="figure-region" />
    <rect id="em-uv" data-region="em-uv" data-label="Ultraviolet" x="326" y="64" width="76" height="190" rx="6" class="figure-region" />
    <rect id="em-xray" data-region="em-xray" data-label="X-Rays" x="410" y="64" width="78" height="190" rx="6" class="figure-region" />
    <rect id="em-gamma" data-region="em-gamma" data-label="Gamma Rays" x="496" y="64" width="84" height="190" rx="6" class="figure-region" />
  </g>
</svg>